[project]
name = "python-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "", email = "nonya@nonya.com" }
]
requires-python = ">=3.14"
dependencies = [
    "maturin>=1.13.3",
    "numpy>=2.4.6",
    "torch>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.maturin]
features = ["python"]
manifest-path = "../core-engine/Cargo.toml"
module-name = "core_engine"
